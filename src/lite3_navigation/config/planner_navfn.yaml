planner_server:
  ros__parameters:
    use_sim_time: true
    bond_heartbeat_period: 0.0
    expected_planner_frequency: 1.0
    costmap_update_timeout: 3.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.1
      use_astar: true
      allow_unknown: false

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 0.3

      update_frequency: 2.0
      publish_frequency: 1.0
      resolution: 0.05
      rolling_window: false
      track_unknown_space: true
      # 与局部图保持相同轮廓/内切半径，缩小横向保守区。
      # 用户指定20cm青圈的仿真调试值；包含padding后的总宽度0.40m。
      # NavFn仍按网格代价规划，不做完整矩形随朝向的碰撞检查；
      # 实际行走由RPP的完整轮廓检查拦截，狭窄转弯不保证可通过。
      footprint: "[[0.40, 0.18], [-0.40, 0.18], [-0.40, -0.18], [0.40, -0.18]]"
      footprint_padding: 0.02

      plugins: ["static_layer", "voxel_layer", "forecast_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        map_subscribe_transient_local: true

      voxel_layer:
        plugin: "lite3_perception::FlatGroundVoxelLayer"
        enabled: true
        footprint_clearing_enabled: true
        ground_height: 0.005
        ground_tolerance: 0.02
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 14
        min_obstacle_height: 0.025
        max_obstacle_height: 0.65
        mark_threshold: 0
        unknown_threshold: 14
        publish_voxel_map: false
        observation_sources: marking clearing
        marking:
          topic: /lite3/perception/obstacles
          data_type: PointCloud2
          sensor_frame: lidar_link
          marking: true
          clearing: false
          min_obstacle_height: 0.025
          max_obstacle_height: 0.65
          obstacle_min_range: 0.12
          obstacle_max_range: 12.0
          observation_persistence: 0.0
          # 秒；无新点云时costmap不再被视为新鲜。
          expected_update_rate: 0.5
        clearing:
          topic: /lite3/perception/clearing
          data_type: PointCloud2
          sensor_frame: lidar_link
          marking: false
          clearing: true
          # 清除射线保留地面/高处有效回波，不用投影scan的虚拟原点。
          min_obstacle_height: -0.1
          max_obstacle_height: 12.0
          raytrace_min_range: 0.12
          raytrace_max_range: 12.0
          observation_persistence: 0.0
          expected_update_rate: 0.5

      forecast_layer:
        plugin: "lite3_perception::ForecastLayer"
        enabled: true
        timeout: 0.5

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.6
        cost_scaling_factor: 3.0

      always_send_full_costmap: true

