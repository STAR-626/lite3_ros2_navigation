controller_server:
  ros__parameters:
    use_sim_time: true
    bond_heartbeat_period: 0.0

    controller_frequency: 20.0
    costmap_update_timeout: 1.0
    odom_topic: /odom
    enable_stamped_cmd_vel: false
    publish_zero_velocity: true

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 20.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # 0.32 m/s 已验证短直线和一次仓库长路线；不是策略最低运动速度。
      desired_linear_vel: 0.6

      lookahead_dist: 0.5
      use_velocity_scaled_lookahead_dist: false

      use_rotate_to_heading: true
      # 当前策略固定 0.6 rad/s 原地转向已实测成功。
      rotate_to_heading_angular_vel: 0.6
      rotate_to_heading_min_angle: 0.5
      # 20 Hz 下，从近似静止允许约 12/20=0.6 rad/s 的启动指令。
      max_angular_accel: 12.0
      allow_reversing: false

      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.08

      # 接近目标时避免降到策略响应弱的小速度；到达后仍发零速度。
      min_approach_linear_velocity: 0.32
      approach_velocity_scaling_dist: 0.6

      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      transform_tolerance: 0.3

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true

      global_frame: odom
      robot_base_frame: base_footprint
      transform_tolerance: 0.3

      update_frequency: 5.0
      publish_frequency: 2.0

      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      track_unknown_space: true
      # 用户指定20cm青圈的仿真调试值：0.80×0.36m，每侧padding=0.02m。
      # 实际检查长0.84m、宽0.40m、内切半径0.20m；前后长度保持。
      # 当前站姿碰撞投影宽约0.375m，侧向余量很小，完整步态需实测。
      footprint: "[[0.40, 0.18], [-0.40, 0.18], [-0.40, -0.18], [0.40, -0.18]]"
      footprint_padding: 0.07

      plugins: ["static_layer", "voxel_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        map_subscribe_transient_local: true

      voxel_layer:
        plugin: "lite3_perception::FlatGroundVoxelLayer"
        enabled: true
        footprint_clearing_enabled: true
        ground_height: 0.005
        ground_tolerance: 0.02
        # 遮挡时保留旧体素；清除需要不同时间戳的连续空闲证据。
        clearing_confirmation_frames: 3
        clearing_occlusion_angle: 0.03
        origin_z: 0.0
        z_resolution: 0.1
        z_voxels: 7
        min_obstacle_height: 0.025
        max_obstacle_height: 0.65
        mark_threshold: 0
        unknown_threshold: 7
        publish_voxel_map: false
        observation_sources: marking clearing
        marking:
          topic: /lite3/perception/obstacles
          data_type: PointCloud2
          sensor_frame: lidar_link
          marking: true
          clearing: false
          min_obstacle_height: 0.025
          max_obstacle_height: 0.65
          obstacle_min_range: 0.12
          obstacle_max_range: 12.0
          observation_persistence: 0.0
          # 秒；无新点云时costmap不再被视为新鲜。
          expected_update_rate: 0.5
        clearing:
          topic: /lite3/perception/clearing
          data_type: PointCloud2
          sensor_frame: lidar_link
          marking: false
          clearing: true
          # 清除射线保留地面/高处有效回波，不用投影scan的虚拟原点。
          min_obstacle_height: -0.1
          max_obstacle_height: 12.0
          raytrace_min_range: 0.12
          raytrace_max_range: 12.0
          observation_persistence: 0.0
          expected_update_rate: 0.5

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.6
        cost_scaling_factor: 3.0

      always_send_full_costmap: true
