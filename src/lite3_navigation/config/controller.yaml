controller_server:
  ros__parameters:
    use_sim_time: true
    bond_heartbeat_period: 0.0

    controller_frequency: 20.0
    costmap_update_timeout: 1.0
    odom_topic: /odom
    enable_stamped_cmd_vel: false
    publish_zero_velocity: true

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 20.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # 0.32 m/s 已验证短直线和一次仓库长路线；不是策略最低运动速度。
      desired_linear_vel: 0.32

      lookahead_dist: 0.5
      use_velocity_scaled_lookahead_dist: false

      use_rotate_to_heading: true
      # 当前策略固定 0.6 rad/s 原地转向已实测成功。
      rotate_to_heading_angular_vel: 0.6
      rotate_to_heading_min_angle: 0.5
      # 20 Hz 下，从近似静止允许约 12/20=0.6 rad/s 的启动指令。
      max_angular_accel: 12.0
      allow_reversing: false

      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.08

      # 接近目标时避免降到策略响应弱的小速度；到达后仍发零速度。
      min_approach_linear_velocity: 0.32
      approach_velocity_scaling_dist: 0.6

      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      transform_tolerance: 0.3

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true

      global_frame: odom
      robot_base_frame: base_footprint
      transform_tolerance: 0.3

      update_frequency: 5.0
      publish_frequency: 2.0

      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      track_unknown_space: true
      robot_radius: 0.4

      plugins: ["static_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        map_subscribe_transient_local: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.6
        cost_scaling_factor: 3.0

      always_send_full_costmap: true
